# Review the current free-plan limits in Render before provisioning.
services:
  - type: web
    name: digital-business-card
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: digital-business-card-db
          property: connectionString
databases:
  - name: digital-business-card-db
    plan: free
    databaseName: card
    user: card
